<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinecrest Chat</title>
<style>
  :root {
    --bg: #f4f1ea; --panel: #ffffff; --ink: #1f2a24; --muted: #6b7a70;
    --brand: #2f5d46; --brand-ink: #ffffff; --bot: #eef3ef; --line: #dfe5df;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141a17; --panel: #1c2420; --ink: #e6ece8; --muted: #93a39a;
      --brand: #5fa37f; --brand-ink: #0d1411; --bot: #25302a; --line: #2e3a33;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, sans-serif; }
  .shell { max-width: 640px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding: 16px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 8px 0 16px; }
  header h1 { font-size: 1.15rem; margin: 0; }
  header a { color: var(--brand); font-size: .9rem; }
  .panel { flex: 1; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-height: 360px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--brand); color: var(--brand-ink); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .msg.error { align-self: flex-start; color: #b3261e; }
  .typing { align-self: flex-start; color: var(--muted); font-style: italic; }
  .hint { color: var(--muted); font-size: .9rem; text-align: center; margin: auto 0; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
  button { padding: 10px 18px; border: 0; border-radius: 10px; background: var(--brand); color: var(--brand-ink); font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div class="shell">
  <header>
    <h1>Pinecrest Outfitters · Help chat</h1>
    <a href="/policy" target="_blank">Store policy</a>
  </header>
  <main class="panel">
    <div id="log" data-testid="chat-log" aria-live="polite">
      <p class="hint" id="hint">Ask about shipping, returns, warranty, products or the Trail Box.</p>
    </div>
    <form id="form" data-testid="chat-form">
      <input id="input" data-testid="chat-input" autocomplete="off" placeholder="Type your question…" aria-label="Message">
      <button id="send" data-testid="chat-send" type="submit">Send</button>
    </form>
  </main>
</div>
<script>
  // The conversation lives only in this page, so a fresh browser context is a fresh chat.
  const history = [];
  const log = document.getElementById('log');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  function add(cls, text, testid) {
    document.getElementById('hint')?.remove();
    const el = document.createElement('div');
    el.className = 'msg ' + cls;
    el.textContent = text; // never innerHTML: replies are untrusted text
    if (testid) el.dataset.testid = testid;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;
    input.value = '';
    add('user', text, 'msg-user');
    history.push({ role: 'user', content: text });

    sendBtn.disabled = true;
    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.dataset.testid = 'chat-typing';
    typing.textContent = 'Assistant is typing…';
    log.appendChild(typing);

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Request failed');
      history.push({ role: 'assistant', content: data.reply });
      add('bot', data.reply, 'msg-bot');
    } catch (err) {
      history.pop();
      add('error', 'Sorry, the assistant is unavailable. ' + err.message, 'msg-error');
    } finally {
      typing.remove();
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
